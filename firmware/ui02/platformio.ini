[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
custom_app_name = MIXU_CYBERTUBE_V1.1_UI02_CARDPUTER_ADV_APP.bin
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.f_cpu = 240000000L
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DMIXU_OFFLINE_BUILD=1
lib_ldf_mode = deep+
extra_scripts =
  pre:tools/build_guard.py
  post:tools/application_only.py


lib_deps =
  https://github.com/m5stack/M5Cardputer.git#bf64d3178ab43928fa02365fbe3937cec99716ad
  https://github.com/m5stack/M5Unified.git#44952cb8e4ac88bf04ad23b9dfd6f4b05c788348
  https://github.com/m5stack/M5GFX.git#28d47949bdc84f30881623476f555398e2194313
  https://github.com/Arduino-IRremote/Arduino-IRremote.git#c4ec014400ccf5a8b3678d5f33e4cc17eca29d23
